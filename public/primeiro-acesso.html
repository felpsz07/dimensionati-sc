<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Primeiro acesso — DimensionaTI</title><style>body{margin:0;background:#f2f5f7;color:#183343;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(94%,520px);background:white;border:1px solid #d8e0e5;border-radius:18px;padding:32px;margin:24px}h1{font-size:28px}label{display:block;margin:22px 0 8px}input,select,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border:1px solid #9badb7;border-radius:8px}button{margin-top:24px;background:#173e54;color:white;cursor:pointer}button:disabled{opacity:.55}p{line-height:1.5}#feedback{color:#9d2525}a{display:block;margin-top:20px}</style><main><small>DIMENSIONATI · PRIMEIRO ACESSO</small><h1>Onde você trabalha?</h1><p>Confirme sua unidade e matrícula para identificar suas solicitações. Você só precisa preencher esta etapa uma vez.</p><form id="perfil"><label for="unidade">Local de trabalho / unidade</label><select id="unidade" required disabled><option value="">Carregando unidades…</option></select><label for="matricula">Matrícula funcional</label><input id="matricula" required maxlength="80" autocomplete="off" placeholder="Digite sua matrícula"><p>Os dados são informados por você; o login Google confirma sua conta, não o vínculo institucional.</p><div id="feedback" role="alert"></div><button id="salvar" disabled>Salvar e entrar no sistema</button></form><button id="sair" type="button">Sair da conta</button></main><script src="/js/primeiro-acesso.js"></script></html>
