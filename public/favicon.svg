<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18132B"/>
      <stop offset="100%" stop-color="#0E0B1F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle base icon container filling the entire icon -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Monitor housing / bezel -->
  <rect x="8" y="9" width="48" height="34" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Screen area -->
  <rect x="11.5" y="12.5" width="41" height="27" rx="3.5" fill="url(#screenGrad)"/>

  <!-- Pulse / dimension metric wave on screen -->
  <path d="M 15 27.5 L 21 27.5 L 25.5 19 L 32 34 L 37 23 L 41 27.5 L 49 27.5" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing emerald status dot on screen -->
  <circle cx="47" cy="16.5" r="2.2" fill="#34D399"/>

  <!-- Monitor Stand Neck & Base -->
  <path d="M 27 43 L 25 50 L 39 50 L 37 43 Z" fill="#E2E8F0"/>
  <rect x="17" y="50" width="30" height="5.5" rx="2.75" fill="#FFFFFF"/>
</svg>